  <ellipse cx="185" cy="370" rx="30" ry="22" fill="#f4f4f5" stroke="#000" stroke-width="2"/>
  <ellipse cx="295" cy="370" rx="30" ry="22" fill="#f4f4f5" stroke="#000" stroke-width="2"/>
  <!-- Laptop base -->
  <rect x="175" y="320" width="150" height="90" rx="6" fill="#000" stroke="#000" stroke-width="2"/>
  <rect x="183" y="328" width="134" height="74" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <!-- Screen lines (code) -->
  <line x1="195" y1="342" x2="285" y2="342" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="195" y1="352" x2="265" y2="352" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="195" y1="362" x2="275" y2="362" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="195" y1="372" x2="250" y2="372" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="195" y1="382" x2="270" y2="382" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="240" cy="220" r="55" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <!-- Hair -->
  <path d="M186 215 Q188 170 240 165 Q292 170 294 215 Q285 190 240 188 Q195 190 186 215Z" fill="#000"/>
  <!-- Eyes -->
  <ellipse cx="222" cy="218" rx="7" ry="8" fill="#000"/>
  <ellipse cx="258" cy="218" rx="7" ry="8" fill="#000"/>
  <circle cx="224" cy="216" r="2.5" fill="#fff"/>
  <circle cx="260" cy="216" r="2.5" fill="#fff"/>
  <!-- Nose -->
  <path d="M238 228 Q240 235 242 228" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
