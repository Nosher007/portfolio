  <path d="M228 242 Q240 252 252 242" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Left arm -->
  <path d="M155 300 Q145 330 165 345" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Right arm -->
  <path d="M325 300 Q335 330 315 345" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="228" y="270" width="24" height="30" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Shoulders -->
  <path d="M155 298 Q180 275 240 270 Q300 275 325 298" stroke="#000" stroke-width="2.5" fill="#fff" stroke-linecap="round"/>
