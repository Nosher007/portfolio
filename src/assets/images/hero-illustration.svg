  <circle cx="90" cy="180" r="18" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="380" cy="140" r="12" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M390 200 L400 215 L380 215 Z" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="70" y="250" width="22" height="22" rx="3" fill="none" stroke="#000" stroke-width="1.5" transform="rotate(15 81 261)"/>
