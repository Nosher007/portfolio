<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <!-- Background -->
  <rect width="640" height="360" fill="#f4f4f5"/>

  <!-- Grid lines subtle -->
  <g stroke="#e4e4e7" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Frozen base model: stacked transformer layers -->
  <text x="150" y="44" font-family="monospace" font-size="10" fill="#71717a" text-anchor="middle">BASE MODEL · FROZEN</text>
  <g stroke="#000" stroke-width="2" fill="white">
    <rect x="80" y="60" width="140" height="34" rx="4"/>
    <rect x="80" y="104" width="140" height="34" rx="4"/>
    <rect x="80" y="148" width="140" height="34" rx="4"/>
    <rect x="80" y="192" width="140" height="34" rx="4"/>
    <rect x="80" y="236" width="140" height="34" rx="4"/>
  </g>
  <g font-family="monospace" font-size="10" fill="#000" text-anchor="middle" font-weight="bold">
    <text x="150" y="81">attention</text>
    <text x="150" y="125">feed-forward</text>
    <text x="150" y="169">attention</text>
    <text x="150" y="213">feed-forward</text>
    <text x="150" y="257">attention</text>
  </g>
  <!-- Lock -->
  <rect x="60" y="292" width="16" height="12" rx="2" fill="#000"/>
  <path d="M63 292 v-4 a5 5 0 0 1 10 0 v4" stroke="#000" stroke-width="2"/>
  <text x="84" y="302" font-family="monospace" font-size="9" fill="#71717a">weights unchanged</text>

  <!-- Trainable low-rank adapters (A x B) -->
  <g stroke="#000" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="220" y1="77" x2="262" y2="77"/>
    <line x1="220" y1="165" x2="262" y2="165"/>
    <line x1="220" y1="253" x2="262" y2="253"/>
  </g>
  <g fill="black">
    <rect x="262" y="66" width="10" height="22" rx="2"/>
    <rect x="276" y="72" width="22" height="10" rx="2"/>
    <rect x="262" y="154" width="10" height="22" rx="2"/>
    <rect x="276" y="160" width="22" height="10" rx="2"/>
    <rect x="262" y="242" width="10" height="22" rx="2"/>
    <rect x="276" y="248" width="22" height="10" rx="2"/>
  </g>
  <text x="280" y="44" font-family="monospace" font-size="10" fill="#000" text-anchor="middle" font-weight="bold">A · B</text>

  <!-- Method comparison cards -->
  <text x="470" y="44" font-family="monospace" font-size="10" fill="#71717a" text-anchor="middle">TRAINABLE PARAMETERS</text>
  <g font-family="monospace" font-size="10" font-weight="bold" fill="#000">
    <text x="360" y="80">FULL FT</text>
    <text x="360" y="136">LoRA</text>
    <text x="360" y="192">ADAPTER</text>
    <text x="360" y="248">PREFIX</text>
  </g>
  <g fill="white" stroke="#d4d4d8" stroke-width="1">
    <rect x="360" y="88" width="220" height="14" rx="2"/>
    <rect x="360" y="144" width="220" height="14" rx="2"/>
    <rect x="360" y="200" width="220" height="14" rx="2"/>
    <rect x="360" y="256" width="220" height="14" rx="2"/>
  </g>
  <g fill="black">
    <rect x="360" y="88" width="220" height="14" rx="2"/>
    <rect x="360" y="144" width="14" height="14" rx="2"/>
    <rect x="360" y="200" width="18" height="14" rx="2"/>
    <rect x="360" y="256" width="10" height="14" rx="2"/>
  </g>
  <g font-family="monospace" font-size="9" fill="#71717a">
    <text x="384" y="155">vs. accuracy &amp; compute</text>
    <text x="388" y="211">vs. accuracy &amp; compute</text>
    <text x="380" y="267">vs. accuracy &amp; compute</text>
  </g>

  <!-- Label -->
  <rect x="20" y="328" width="168" height="22" rx="3" fill="black"/>
  <text x="104" y="343" font-family="monospace" font-size="10" fill="white" text-anchor="middle" font-weight="bold">PEFT • MS Thesis 2026</text>

  <!-- Tech tags -->
  <rect x="200" y="330" width="84" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="242" y="343" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">Flan-T5-base</text>
  <rect x="292" y="330" width="90" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="337" y="343" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">Llama-3.2-3B</text>
  <rect x="390" y="330" width="104" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="442" y="343" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">medical · legal QA</text>
</svg>
