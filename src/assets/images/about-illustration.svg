  <circle cx="290" cy="283" r="11" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <!-- Book -->
  <rect x="295" y="265" width="40" height="55" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="315" y1="265" x2="315" y2="320" stroke="#000" stroke-width="1.5"/>
  <line x1="302" y1="278" x2="328" y2="278" stroke="#000" stroke-width="1"/>
  <line x1="302" y1="287" x2="328" y2="287" stroke="#000" stroke-width="1"/>
  <line x1="302" y1="296" x2="328" y2="296" stroke="#000" stroke-width="1"/>
  <line x1="302" y1="305" x2="320" y2="305" stroke="#000" stroke-width="1"/>
  <!-- Head -->
  <circle cx="200" cy="165" r="58" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <!-- Hair -->
  <path d="M143 158 Q148 108 200 103 Q252 108 257 158 Q245 128 200 125 Q155 128 143 158Z" fill="#000"/>
  <!-- Ear left -->
  <ellipse cx="142" cy="168" rx="10" ry="13" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Ear right -->
  <ellipse cx="258" cy="168" rx="10" ry="13" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="183" cy="166" rx="8" ry="9" fill="#000"/>
  <ellipse cx="217" cy="166" rx="8" ry="9" fill="#000"/>
  <circle cx="185" cy="164" r="2.5" fill="#fff"/>
  <circle cx="219" cy="164" r="2.5" fill="#fff"/>
  <!-- Eyebrows -->
  <path d="M174 153 Q183 148 192 153" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M208 153 Q217 148 226 153" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M197 178 Q200 186 203 178" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M187 194 Q200 206 213 194" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="186" y="220" width="28" height="25" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Floating dots -->
  <circle cx="55" cy="140" r="6" fill="#000"/>
  <circle cx="75" cy="125" r="4" fill="#000" opacity="0.4"/>
  <circle cx="345" cy="200" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
  <circle cx="360" cy="220" r="3" fill="#000" opacity="0.3"/>
</svg>
