<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <!-- Shadow -->
  <ellipse cx="200" cy="450" rx="80" ry="12" fill="#f4f4f5"/>
  <!-- Legs -->
  <rect x="165" y="340" width="28" height="100" rx="14" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="207" y="340" width="28" height="100" rx="14" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <!-- Shoes -->
  <ellipse cx="179" cy="445" rx="22" ry="10" fill="#000"/>
  <ellipse cx="221" cy="445" rx="22" ry="10" fill="#000"/>
  <!-- Body -->
  <rect x="148" y="230" width="104" height="120" rx="20" fill="#000" stroke="#000" stroke-width="2"/>
  <!-- Shirt collar -->
  <path d="M190 230 L200 250 L210 230" stroke="#fff" stroke-width="2" fill="none"/>
  <!-- Left arm reaching out -->
  <path d="M148 260 Q110 270 95 290 Q85 305 100 315" stroke="#000" stroke-width="15" stroke-linecap="round" fill="none"/>
  <!-- Left hand -->
  <circle cx="103" cy="318" r="12" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <!-- Right arm -->
  <path d="M252 260 Q280 265 288 280" stroke="#000" stroke-width="13" stroke-linecap="round" fill="none"/>
