<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <!-- Background -->
  <rect width="640" height="360" fill="#f4f4f5"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="60" x2="640" y2="60" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="0" y1="120" x2="640" y2="120" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="0" y1="180" x2="640" y2="180" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="0" y1="240" x2="640" y2="240" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="0" y1="300" x2="640" y2="300" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="360" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="360" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="360" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="360" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="360" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="560" y1="0" x2="560" y2="360" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Central shield -->
  <path d="M320 80 L370 100 L370 150 Q370 190 320 210 Q270 190 270 150 L270 100 Z" fill="white" stroke="#000000" stroke-width="2.5"/>
  <!-- Shield checkmark -->
  <path d="M300 150 L315 165 L345 135" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Agent nodes around the shield -->
  <!-- Agent 1 - top left -->
  <circle cx="160" cy="90" r="28" fill="white" stroke="#000000" stroke-width="2"/>
  <text x="160" y="87" font-family="monospace" font-size="9" fill="#000" text-anchor="middle" font-weight="bold">INGEST</text>
  <text x="160" y="99" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">agent</text>

  <!-- Agent 2 - top right -->
  <circle cx="480" cy="90" r="28" fill="white" stroke="#000000" stroke-width="2"/>
  <text x="480" y="87" font-family="monospace" font-size="9" fill="#000" text-anchor="middle" font-weight="bold">ANALYZE</text>
  <text x="480" y="99" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">agent</text>

  <!-- Agent 3 - left -->
  <circle cx="100" cy="210" r="28" fill="white" stroke="#000000" stroke-width="2"/>
  <text x="100" y="207" font-family="monospace" font-size="9" fill="#000" text-anchor="middle" font-weight="bold">CVE</text>
  <text x="100" y="219" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">parser</text>

  <!-- Agent 4 - right -->
  <circle cx="540" cy="210" r="28" fill="white" stroke="#000000" stroke-width="2"/>
  <text x="540" y="207" font-family="monospace" font-size="9" fill="#000" text-anchor="middle" font-weight="bold">REPORT</text>
  <text x="540" y="219" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">agent</text>

  <!-- Agent 5 - bottom -->
  <circle cx="320" cy="295" r="28" fill="black" stroke="#000000" stroke-width="2"/>
  <text x="320" y="292" font-family="monospace" font-size="9" fill="white" text-anchor="middle" font-weight="bold">RAG</text>
  <text x="320" y="304" font-family="monospace" font-size="9" fill="#d4d4d8" text-anchor="middle">engine</text>

  <!-- Connection lines from center to agents -->
  <line x1="270" y1="140" x2="186" y2="103" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="370" y1="140" x2="454" y2="103" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="275" y1="170" x2="128" y2="200" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="365" y1="170" x2="512" y2="200" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="320" y1="210" x2="320" y2="267" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Label -->
  <rect x="20" y="328" width="160" height="22" rx="3" fill="black"/>
  <text x="100" y="343" font-family="monospace" font-size="10" fill="white" text-anchor="middle" font-weight="bold">CyberSentinel • 5 Agents</text>

  <!-- Tech tags -->
  <rect x="192" y="330" width="68" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="226" y="343" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">LangGraph</text>
  <rect x="268" y="330" width="42" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="289" y="343" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">RAG</text>
  <rect x="318" y="330" width="36" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="336" y="343" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">GCP</text>
</svg>
