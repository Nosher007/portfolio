<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <!-- Background -->
  <rect width="640" height="360" fill="#f4f4f5"/>

  <!-- Grid -->
  <line x1="0" y1="60" x2="640" y2="60" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="0" y1="120" x2="640" y2="120" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="0" y1="180" x2="640" y2="180" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="0" y1="240" x2="640" y2="240" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="0" y1="300" x2="640" y2="300" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Left: Churn prediction gauge -->
  <rect x="30" y="40" width="270" height="240" rx="4" fill="white" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="165" y="65" font-family="monospace" font-size="10" fill="#71717a" text-anchor="middle">CHURN PREDICTION — XGBoost</text>

  <!-- Bar chart for feature importance -->
  <text x="55" y="90" font-family="monospace" font-size="9" fill="#71717a">Feature Importance</text>

  <!-- Bars -->
  <rect x="55" y="95" width="180" height="14" rx="2" fill="#000"/>
  <text x="240" y="106" font-family="monospace" font-size="9" fill="#71717a">0.32</text>
  <text x="55" y="108" font-family="monospace" font-size="8" fill="#71717a">tenure</text>

  <rect x="55" y="115" width="140" height="14" rx="2" fill="#27272a"/>
  <text x="200" y="126" font-family="monospace" font-size="9" fill="#71717a">0.25</text>
  <text x="55" y="128" font-family="monospace" font-size="8" fill="#71717a">monthly charges</text>

  <rect x="55" y="135" width="105" height="14" rx="2" fill="#404040"/>
  <text x="165" y="146" font-family="monospace" font-size="9" fill="#71717a">0.19</text>
  <text x="55" y="148" font-family="monospace" font-size="8" fill="#71717a">contract type</text>

  <rect x="55" y="155" width="72" height="14" rx="2" fill="#71717a"/>
  <text x="132" y="166" font-family="monospace" font-size="9" fill="#71717a">0.13</text>
  <text x="55" y="168" font-family="monospace" font-size="8" fill="#71717a">tech support</text>

  <rect x="55" y="175" width="45" height="14" rx="2" fill="#d4d4d8"/>
  <text x="105" y="186" font-family="monospace" font-size="9" fill="#71717a">0.08</text>
  <text x="55" y="188" font-family="monospace" font-size="8" fill="#71717a">payment method</text>

  <!-- Accuracy score -->
  <line x1="55" y1="205" x2="275" y2="205" stroke="#e4e4e7" stroke-width="1"/>
  <text x="55" y="225" font-family="monospace" font-size="9" fill="#71717a">Model Accuracy</text>
  <text x="275" y="225" font-family="monospace" font-size="14" fill="#000" text-anchor="end" font-weight="bold">87.4%</text>

  <text x="55" y="245" font-family="monospace" font-size="9" fill="#71717a">AUC-ROC</text>
  <text x="275" y="245" font-family="monospace" font-size="14" fill="#000" text-anchor="end" font-weight="bold">0.91</text>

  <text x="55" y="262" font-family="monospace" font-size="9" fill="#71717a">Test set: 1,409 samples</text>

  <!-- Right: Spending clusters (PCA scatter) -->
  <rect x="340" y="40" width="270" height="240" rx="4" fill="white" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="475" y="65" font-family="monospace" font-size="10" fill="#71717a" text-anchor="middle">SPENDING CLUSTERS — PCA</text>

  <!-- Axis lines -->
  <line x1="370" y1="250" x2="590" y2="250" stroke="#d4d4d8" stroke-width="1"/>
  <line x1="370" y1="80" x2="370" y2="250" stroke="#d4d4d8" stroke-width="1"/>
  <text x="480" y="265" font-family="monospace" font-size="8" fill="#71717a" text-anchor="middle">PC1 (38.2% variance)</text>
  <text x="358" y="165" font-family="monospace" font-size="8" fill="#71717a" text-anchor="middle" transform="rotate(-90 358 165)">PC2 (21.5%)</text>

  <!-- Cluster 1 - high spenders (black dots) -->
  <circle cx="530" cy="110" r="5" fill="#000"/>
  <circle cx="545" cy="125" r="5" fill="#000"/>
  <circle cx="520" cy="130" r="5" fill="#000"/>
  <circle cx="558" cy="108" r="5" fill="#000"/>
  <circle cx="538" cy="142" r="5" fill="#000"/>
  <circle cx="515" cy="115" r="5" fill="#000"/>
  <circle cx="550" cy="138" r="5" fill="#000"/>

  <!-- Cluster 2 - medium spenders (gray dots) -->
  <circle cx="460" cy="165" r="5" fill="#71717a"/>
  <circle cx="478" cy="155" r="5" fill="#71717a"/>
  <circle cx="448" cy="178" r="5" fill="#71717a"/>
  <circle cx="492" cy="170" r="5" fill="#71717a"/>
  <circle cx="470" cy="185" r="5" fill="#71717a"/>
  <circle cx="483" cy="145" r="5" fill="#71717a"/>
  <circle cx="455" cy="190" r="5" fill="#71717a"/>

  <!-- Cluster 3 - low spenders (light gray) -->
  <circle cx="410" cy="220" r="5" fill="#d4d4d8" stroke="#71717a" stroke-width="1"/>
  <circle cx="425" cy="210" r="5" fill="#d4d4d8" stroke="#71717a" stroke-width="1"/>
  <circle cx="398" cy="228" r="5" fill="#d4d4d8" stroke="#71717a" stroke-width="1"/>
  <circle cx="440" cy="218" r="5" fill="#d4d4d8" stroke="#71717a" stroke-width="1"/>
  <circle cx="415" cy="235" r="5" fill="#d4d4d8" stroke="#71717a" stroke-width="1"/>
  <circle cx="435" cy="205" r="5" fill="#d4d4d8" stroke="#71717a" stroke-width="1"/>

  <!-- Cluster ellipses -->
  <ellipse cx="535" cy="124" rx="35" ry="25" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>
  <ellipse cx="470" cy="167" rx="32" ry="24" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>
  <ellipse cx="418" cy="220" rx="32" ry="20" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>

  <!-- Legend -->
  <circle cx="380" cy="90" r="5" fill="#000"/>
  <text x="390" y="94" font-family="monospace" font-size="8" fill="#71717a">High value</text>
  <circle cx="380" cy="108" r="5" fill="#71717a"/>
  <text x="390" y="112" font-family="monospace" font-size="8" fill="#71717a">Mid tier</text>
  <circle cx="380" cy="126" r="5" fill="#d4d4d8" stroke="#71717a" stroke-width="1"/>
  <text x="390" y="130" font-family="monospace" font-size="8" fill="#71717a">Low spend</text>

  <!-- Bottom label -->
  <rect x="20" y="310" width="200" height="22" rx="3" fill="black"/>
  <text x="120" y="325" font-family="monospace" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Churn + Spending Analysis</text>

  <rect x="230" y="312" width="56" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="258" y="325" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">XGBoost</text>
  <rect x="294" y="312" width="34" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="311" y="325" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">PCA</text>
  <rect x="336" y="312" width="92" height="18" rx="2" fill="white" stroke="#d4d4d8" stroke-width="1"/>
  <text x="382" y="325" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">Neural Networks</text>
</svg>
